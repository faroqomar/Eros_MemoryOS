ction"><div class="sectiontop"><h2>${t('Pick up where you left off','أكمل من حيث توقفت')}</h2></div><div class="list">${state.memories.slice(0,2).map(m=>row(m.voice?'mic':'note',esc(m.text.slice(0,52))+(m.text.length>52?'…':''),t('Just added · Your words','أضيفت الآن · كلماتك'),m.id)).join('')}${row('project',t('A weekend away','عطلة نهاية الأسبوع'),t('Maya · Dates still open','مايا · الموعد لم يُحدد'), 'project')}${row('mic',t('A little catch-up with Omar','حديث قصير مع عمر'),t('Today · Sample voice note','اليوم · ملاحظة صوتية نموذجية'),'conversation')}${row('calendar',t('Maya’s birthday','عيد ميلاد مايا'),t('June 14 · Choose a reminder','١٤ يونيو · اختر تذكيراً'),'birthdays')}</div></section></div><p class="bottom-note">${ico('shield')}${t('Fictional demo · Your real memories stay untouched','عرض ببيانات خيالية · ذكرياتك الحقيقية لا تتغير')}</p></section>`}
function people(){return `${head(t('People','الأشخاص'),t('Remember the details that make someone them.','تذكّر التفاصيل التي تميز كل شخص.'))}<label class="search">${ico('search')}<span class="sr-only">${t('Find a person','ابحث عن شخص')}</span><input id="peopleSearch" placeholder="${t('Find a person…','ابحث عن شخص…')}"></label><div id="peopleResults">${personRows('')}</div>`}

rimary full" style="margin-top:24px" data-route="conversation">${t('Ask about this project','اسأل عن هذا المشروع')}${ico('arrow')}</button></div></div>`}

function search(){return `${head(t('Find a memory','ابحث عن ذكرى'),t('Use a name, a topic or a few words you remember.','استخدم اسماً، موضوعاً، أو كلمات تتذكرها.'))}<label class="search">${ico('search')}<span class="sr-only">${t('Search memories','البحث في الذكريات')}</span><input id="searchInput" dir="auto" placeholder="${t('People, plans, little details…','أشخاص، خطط، تفاصيل صغيرة…')}" value="${esc(state.query)}"></label><div id="searchResults" aria-live="polite">${searchResults(state.query)}</div>`}
function memory(id){const m=state.memories.find(a=>a.id===id);const omar=id==='memory-omar',homeNote=id==='memory-home';const text=m?esc(m.text):omar?t('Omar: “Sunday lunch sounds good. I’ll bring dessert.”\nYou: “Lovely, come around one.”','عمر: «غداء الأحد مناسب. سأحضر الحلوى.»\nأنت: «جميل، تعال حوالي الواحدة.»'):homeNote?t('I want to keep the reading chair by the window. Maybe a small bookshelf would fit beside it.','أريد إبقاء كرسي القراءة بجوار النافذة. ربما يناسبه رف كتب صغير.'):t('You: “Shall we go somewhere quiet for a weekend? Maybe bring a picnic?”\nMaya: “I’d love that. Let’s pick the dates later. I need to check my calendar.”\nYou: “Omar suggested the riverside park.”','أنت: «هل نذهب إلى مكان هادئ في عطلة؟ ربما نحضر طعاماً للنزهة؟»\nمايا: «أحب ذلك. لنحدد الموعد لاحقاً، أحتاج إلى مراجعة جدولي.»\nأنت: «اقترح عمر الحديقة القريبة من النهر.»');return `${head(t('Original memory','الذكرى الأصلية'),m?t('Your words · Just added','كلماتك · أضيفت الآن'):t('Fictional conversation · November 21, 2026','محادثة خيالية · ٢١ نوفمبر ٢٠٢٦'))}<section class="panel"><span class="badge neutral">${t('Original · Unchanged','الأصل · دون تغيير')}</span><div class="original" style="white-space:pre-wrap" dir="auto">${text}</div><p class="source-label">${t('Sample source shown in full. Summaries stay separate from these words.','المصدر النموذجي معروض بالكامل. تبقى الملخصات منفصلة عن هذه الكلمات.')}</p></section>${!m?`<button class="secondary" data-route="${omar?'person-omar':homeNote?'project-home':'project'}">${t('View related '+(omar?'person':'project'),omar?'رؤية الشخص المرتبط':'رؤية المشروع المرتبط')}${ico('arrow')}</button>`:''}`}
function conversation(){const voiceText=state.activeVoice?.text;return `${head(t('A little catch-up','حديث قصير'),state.private?t('Temporary sample conversation · Nothing added to memories','محادثة نموذجية مؤقتة · لا تُضاف ذكريات'):t('Sample conversation · No real recording or AI','محادثة نموذجية · دون تسجيل أو ذكاء اصطناعي حقيقي'))}<div class="conversation"><div class="message mine"><span class="eyebrow">${t('Your sample voice note','ملاحظتك الصوتية النموذجية')} · <bdi>${formatTime(state.activeVoice?.seconds??18)}</bdi></span><div class="actions" style="margin-top:0"><button class="secondary" data-action="sample-play">${ico('play')}${t('Read sample','قراءة النموذج')}</button></div><details id="sampleTranscript" style="margin-top:14px"><summary class="textbtn">${t('Show transcript','عرض النص')}</summary><p>${voiceText?esc(voiceText):t('Omar said he can bring dessert for Sunday lunch. Also, Maya and I still need to choose dates for our weekend away.','قال عمر إنه يستطيع إحضار الحلوى لغداء الأحد. وما زلت أنا ومايا نحتاج إلى تحديد موعد عطلتنا.')}</p></details></div><div class="message answer"><span class="eyebrow">${t('MemoryOS · Sample reply','ميموري أو إس · رد نموذجي')}</span><p>${voiceText?t('Your edited sample is saved above. This demo does not generate a reply to new words.','حُفظ نموذجك المعدل أعلاه. لا يولد هذا العرض رداً على كلمات جديدة.'):t('Omar offered to bring dessert for Sunday. The weekend with Maya is still an open plan; you have not agreed on dates.','عرض عمر إحضار الحلوى يوم الأحد. العطلة مع مايا ما زالت خطة مفتوحة؛ لم تتفقا على موعد.')}</p><div class="source-label">${voiceText?t('Explore the sample sources:','استكشف المصادر النموذجية:'):t('Based on these original memories:','بناءً على هذه الذكريات الأصلية:')}</div><button class="textbtn" data-route="memory-omar">${ico('note')}${t('Sunday lunch · Omar','غداء الأحد · عمر')}${ico('arrow')}</button><button class="textbtn" data-route="memory-trip" style="display:flex">${ico('note')}${t('Weekend dates · Maya','موعد العطلة · مايا')}${ico('arrow')}</button></div>${state.messages.map(m=>`<div class="message mine" dir="auto">${esc(m)}</div><div class="message answer"><span class="eyebrow">${t('Demo reply','رد تجريبي')}</span><p>${t('This prototype uses a fixed sample conversation. You can explore the original memories below; it does not generate an answer to new questions.','يستخدم هذا النموذج محادثة ثابتة. يمكنك تصفح الذكريات الأصلية أدناه؛ ولا يولد إجابة لأسئلة جديدة.')}</p><button class="textbtn" data-route="search">${t('Find a memory','ابحث عن ذكرى')}${ico('arrow')}</button></div>`).join('')}<form class="capture" id="chatForm"><label class="sr-only" for="chatInput">${t('Message','رسالة')}</label><input id="chatInput" dir="auto" placeholder="${t('Try a follow-up…','جرّب رسالة متابعة…')}"><button class="voice" type="submit" aria-label="${t('Send demo message','إرسال الرسالة التجريبية')}">${ico('arrow')}</button></form><p class="sample">${t('Sample replies only. Nothing is sent to another person or service.','ردود نموذجية فقط. لا يُرسل شيء إلى شخص أو خدمة.')}</p>${state.private?`<button class="secondary full" data-action="end-private">${t('End temporary conversation','إنهاء المحادثة المؤقتة')}</button>`:''}</div>`}
function startClock(){clearInterval(recordTimer);recordTimer=setInterval(()=>{if(state.route!=='record'||state.paused)return;state.seconds++;const timer=$('#recordTimer');if(timer)timer.textContent=formatTime(state.seconds)},1000)}
function formatTime(n){return `${Math.floor(n/60).toString().padStart(2,'0')}:${(n%60).toString().padStart(2,'0')}`}
function record(){return `${back()}<div class="record-wrap"><div class="viewhead"><h1>${t('Try a voice note','جرّب ملاحظة صوتية')}</h1><p>${t('A sample recording. Your microphone is off.','تسجيل نموذجي. ميكروفونك مغلق.')}</p></div><div class="record-status"><span class="dot"></span><span>${state.paused?t('Sample paused','النموذج متوقف'):t('Sample recording','تسجيل نموذجي')}</span></div><div class="timer" id="recordTimer" dir="ltr">${formatTime(state.seconds)}</div><div class="wave ${state.paused?'paused':''}" aria-hidden="true">${Array.from({length:35},(_,i)=>`<i style="--h:${20+Math.sin(i*1.7)**2*65}px;--d:${i*.04}s"></i>`).join('')}</div><section class="panel"><label class="label" for="transcript">${t('Sample transcript · You can edit it','نص نموذجي · يمكنك تعديله')}</label><textarea id="transcript" class="transcript" dir="auto">${state.recordDraft!==null?esc(state.recordDraft):t('Omar said he can bring dessert for Sunday lunch. Maya and I still need to choose dates for our weekend away.','قال عمر إنه يستطيع إحضار الحلوى لغداء الأحد. وما زلت أنا ومايا نحتاج إلى تحديد موعد عطلتنا.')}</textarea></section><div class="record-actions"><button class="secondary" data-action="pause-record">${ico(state.paused?'play':'pause')}${state.paused?t('Resume','متابعة'):t('Pause','إيقاف مؤقت')}</button><button class="primary" data-action="save-record">${ico('check')}${t('Save sample','حفظ النموذج')}</button><button class="danger" data-action="discard-record">${ico('trash')}${t('Discard','حذف')}</button></div><p class="sample" style="text-align:center">${t('Only sample text is saved in this demo. Reloading clears it.','يُحفظ النص النموذجي فقط في هذا العرض. إعادة التحميل تمسحه.')}</p></div>`}
function birthdays(){return `${head(t('Birthdays','أعياد الميلاد'),t('Keep the dates you choose to remember.','احتفظ بالتواريخ التي تختار تذكرها.'))}<div class="row"><div class="date-block"><span>${t('JUN','يونيو')}</span><strong>14</strong></div><div class="copy"><h3>${t('Maya’s birthday','عيد ميلاد مايا')}</h3><p>${t('Confirmed by you','أكدتها أنت')}</p></div><button class="iconbtn" data-route="person-maya" aria-label="${t('Open Maya','فتح مايا')}">${ico('chevron')}</button></div><section class="panel" style="margin-top:24px"><h2>${t('A gentle reminder','تذكير بسيط')}</h2><p class="muted">${t('One day before, at 9:00 in the morning.','قبل يوم واحد، في التاسعة صباحاً.')}</p><div class="settings-row"><div><h3>${t('Birthday reminder','تذكير بعيد الميلاد')}</h3><p>${t('Preview only · No notification is scheduled','معاينة فقط · لن تُجدول إشعارات')}</p></div><button class="switch" role="switch" aria-checked="${state.reminder}" data-action="reminder" aria-label="${t('Birthday reminder preview','معاينة تذكير عيد الميلاد')}"></button></div>${state.reminder?`<p style="margin-top:17px;color:var(--accent)">${t('Preview: Maya’s birthday is tomorrow.','معاينة: عيد ميلاد مايا غداً.')}</p>`:''}</section>`}
function connections(){return `${head(t('Connections','الروابط'),t('See how familiar people and ideas fit together.','رؤية الروابط بين الأشخاص والأفكار المألوفة.'))}<div class="tabs" role="tablist"><button role="tab" aria-selected="${state.view==='map'}" tabindex="${state.view==='map'?0:-1}" data-view="map">${t('Map','خريطة')}</button><button role="tab" aria-selected="${state.view==='list'}" tabindex="${state.view==='list'?0:-1}" data-view="list">${t('Simple list','قائمة بسيطة')}</button></div>${state.view==='map'?`<div class="connections" aria-label="${t('Weekend project linked to Maya, Omar, picnic idea and original note','مشروع العطلة مرتبط بمايا وعمر وفكرة النزهة والملاحظة الأصلية')}"><svg viewBox="0 0 400 320" preserveAspectRatio="none" aria-hidden="true"><path d="M72 77 204 170 320 90M204 170 92 259M204 170 320 259"/></svg><button class="node" data-route="person-maya">${name('maya')}<span>${t('Friend','صديقة')}</span></button><button class="node" data-route="person-omar">${name('omar')}<span>${t('Brother','أخ')}</span></button><button class="node center" data-route="project">${t('Weekend away','عطلة قصيرة')}<span>${t('Project','مشروع')}</span></button><button class="node" data-route="ideas">${t('A picnic','نزهة طعام')}<span>${t('Idea','فكرة')}</span></button><button class="node" data-route="memory-trip">${t('The conversation','المحادثة')}<span>${t('Original source','المصدر الأصلي')}</span></button></div><p class="connection-label">${t('Tap a person or topic to explore.','اضغط على شخص أو موضوع لاستكشافه.')}</p>`:`<div class="list">${row('people',name('maya'),t('Planning a weekend away together','تخططان لعطلة قصيرة معاً'),'person-maya')}${row('people',name('omar'),t('Suggested a nearby place for the trip','اقترح مكاناً قريباً للرحلة'),'person-omar')}${row('idea',t('A picnic','نزهة طعام'),t('An idea for the weekend','فكرة للعطلة'),'ideas')}${row('note',t('The original conversation','المحادثة الأصلية'),t('Maya · Dates are still open','مايا · الموعد ما زال مفتوحاً'),'memory-trip')}</div>`}<section class="panel" style="margin-top:24px"><h3>${t('Keep the context','احتفظ بالسياق')}</h3><p class="muted" style="margin-top:9px">${t('A connection means these memories share a topic. It does not prove what someone thinks or feels.','الرابط يعني أن هذه الذكريات تشترك في موضوع. ولا يثبت ما يفكر فيه شخص أو يشعر به.')}</p><button class="textbtn" data-route="memory-trip">${t('Read the original','قراءة الأصل')}${ico('arrow')}</button></section>`}
function importView(){const p=state.importProgress;return `${head(t('Bring in a conversation','أضف محادثة'),t('Try importing a fictional chat with Maya.','جرّب استيراد محادثة خيالية مع مايا.'))}<div class="import-box">${ico('import')}<div><h3>${t('Chat with Maya.zip','محادثة مع مايا.zip')}</h3><span class="small muted">${t('Sample archive · 24 messages','أرشيف نموذجي · ٢٤ رسالة')}</span></div></div>${!state.importStarted&&!state.importDone?`<section class="panel"><h2>${t('You choose what to bring in','أنت تختار ما تضيفه')}</h2><p class="muted">${t('This demo uses a sample archive. It will not open your files, connect an account or upload anything.','يستخدم هذا العرض أرشيفاً نموذجياً. لن يفتح ملفاتك أو يربط حساباً أو يرفع شيئاً.')}</p><button class="primary full" data-action="start-import">${t('Try sample import','تجربة الاستيراد النموذجي')}${ico('arrow')}</button></section>`:`<section class="panel"><div class="sectiontop"><h2>${state.importDone?t('Ready to explore','جاهز للاستكشاف'):state.importPaused?t('Import paused','الاستيراد متوقف'):t('Reading the sample','قراءة النموذج')}</h2><strong style="font-variant-numeric:tabular-nums">${p}%</strong></div><div class="progress" role="progressbar" aria-label="${t('Sample import progress','تقدم الاستيراد النموذجي')}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${p}"><span style="width:${p}%"></span></div><p class="sample">${t('Simulated progress · No real files are processed','تقدم تمثيلي · لا تُعالج ملفات حقيقية')}</p>${[['Messages read','قراءة الرسائل',20],['People linked','ربط الأشخاص',60],['Ready to search','جاهز للبحث',100]].map(([en,ar,n])=>`<div class="stage"><span>${ico(p>=n?'check':'note')}${t(en,ar)}</span><span class="muted">${p>=n?t('Done','تم'):t('Waiting','انتظار')}</span></div>`).join('')}<div class="actions">${state.importDone?`<button class="primary" data-route="person-maya">${t('Explore Maya’s memories','استكشاف ذكريات مايا')}${ico('arrow')}</button>`:`<button class="secondary" data-action="pause-import">${ico(state.importPaused?'play':'pause')}${state.importPaused?t('Resume','متابعة'):t('Pause','إيقاف مؤقت')}</button><button class="danger" data-action="cancel-import">${t('Cancel import','إلغاء الاستيراد')}</button>`}</div></section>`}<p class="sample">${t('Original messages stay separate from summaries and interpretations.','تبقى الرسائل الأصلية منفصلة عن الملخصات والتفسيرات.')}</p>`}
function startImport(){state.importStarted=true;state.importProgress=0;state.importPaused=false;state.importDone=false;clearInterval(importTimer);importTimer=setInterval(()=>{if(state.importPaused)return;state.importProgress=Math.min(100,state.importProgress+10);if(state.importProgress===100){clearInterval(importTimer);state.importDone=true;toast(t('Sample conversation is ready.','المحادثة النموذجية جاهزة.'))}if(state.route==='import')render()},550);render()}
function settings(){return `${head(t('Privacy & preferences','الخصوصية والتفضيلات'),t('Your memories, your choices.','ذكرياتك، خياراتك.'))}<div class="split"><section><div class="settings-row"><div><h3>${t('Temporary conversation','محادثة مؤقتة')}</h3><p>${t('New demo messages disappear when you turn this off.','تختفي الرسائل التجريبية الجديدة عند إيقافها.')}</p></div><button class="switch" role="switch" aria-checked="${state.private}" data-action="private" aria-label="${t('Temporary conversation','محادثة مؤقتة')}"></button></div><div class="settings-row"><div><h3>${t('Language','اللغة')}</h3><p>${t('Try Arabic and right-to-left layout','جرّب الإنجليزية والتخطيط من اليسار')}</p></div><button class="secondary" data-action="language">${t('العربية','English')}</button></div><div class="settings-row"><div><h3>${t('Appearance','المظهر')}</h3><p>${t('Dark forest · Designed for comfortable reading','غابة داكنة · لقراءة مريحة')}</p></div>${ico('sun')}</div></section><section class="panel"><span class="eyebrow">${t('About this demo','حول هذا العرض')}</span><h2 style="margin-top:13px">${t('A safe space to try it','مساحة آمنة للتجربة')}</h2><p class="muted">${t('Everything here is fictional. Changes stay in this page until you reload it. No files, microphone, account or cloud service are connected.','كل ما هنا خيالي. تبقى التغييرات في هذه الصفحة حتى إعادة تحميلها. لا توجد ملفات أو ميكروفون أو حساب أو خدمة سحابية متصلة.')}</p><button class="secondary" data-action="reset">${t('Reset demo','إعادة ضبط العرض')}</button></section></div>`}
function render(){const focusAction=document.activeElement?.dataset?.action;document.documentElement.lang=state.lang;$('#app').dir=state.lang==='ar'?'rtl':'ltr';$('#menu').innerHTML=`${ico('menu')}<span>${t('Menu','القائمة')}</span>`;$('#menu').setAttribute('aria-label',t('Open menu','فتح القائمة'));$('.brand').innerHTML=`${ico('leaf')}MemoryOS`;$('#find').innerHTML=`${ico('search')}<span>${t('Find','بحث')}</span>`;const r=state.route;$('#main').innerHTML=r==='home'?home():r==='people'?people():r.startsWith('person-')?person(r.slice(7)):r==='projects'?projects():r==='project'||r==='project-home'?project(r==='project-home'):r==='ideas'?ideas():r==='search'?search():r==='conversation'?conversation():r==='record'?record():r==='birthdays'?birthdays():r==='connections'?connections():r==='import'?importView():r==='settings'?settings():r.startsWith('memory-')||r.startsWith('saved-')?memory(r):home();if(focusAction)$(`[data-action="${focusAction}"]`)?.focus({preventScroll:true});}
function drawer(){returnFocus=document.activeElement;const routes=[['home','home','Home','الرئيسية'],['people','people','People','الأشخاص'],['projects','project','Projects','المشاريع'],['ideas','idea','Ideas','الأفكار'],['birthdays','calendar','Birthdays','أعياد الميلاد'],['connections','link','Connections','الروابط']];$('#drawer').dir=state.lang==='ar'?'rtl':'ltr';$('#drawer').innerHTML=`<div class="drawer-top"><h2 id="drawerTitle">MemoryOS</h2><button class="iconbtn" data-action="close-menu" aria-label="${t('Close menu','إغلاق القائمة')}">${ico('close')}</button></div><nav aria-label="${t('Main navigation','القائمة الرئيسية')}">${routes.map(([r,i,en,ar])=>`<button data-route="${r}" ${state.route===r?'aria-current="page"':''}>${ico(i)}${t(en,ar)}</button>`).join('')}<hr><button data-route="import">${ico('import')}${t('Import a conversation','استيراد محادثة')}</button><button data-route="settings">${ico('shield')}${t('Privacy & preferences','الخصوصية والتفضيلات')}</button></nav><p class="drawer-foot">${t('COMMONPLACE · DESIGN 03<br>Fictional data. Reload to start again.','COMMONPLACE · التصميم ٠٣<br>بيانات خيالية. أعد التحميل للبدء من جديد.')}</p>`;$('#drawer').showModal()}
document.addEventListener('keydown',e=>{if(e.target.getAttribute('role')!=='tab'||!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const tabs=[...e.target.parentElement.querySelectorAll('[role=tab]')];let i=tabs.indexOf(e.target);if(e.key==='Home')i=0;else if(e.key==='End')i=tabs.length-1;else i=(i+(e.key==='ArrowRight'?1:-1)*(state.lang==='ar'?-1:1)+tabs.length)%tabs.length;tabs[i].click()});
$('#menu').addEventListener('click',drawer);
document.addEventListener('click',e=>{const r=e.target.closest('[data-route]');if(r){if($('#drawer').open)$('#drawer').close();route(r.dataset.route);return}const tab=e.target.closest('[data-tab]');if(tab){state.tab=tab.dataset.tab;render();$(`[data-tab="${state.tab}"]`)?.focus();return}const view=e.target.closest('[data-view]');if(view){state.view=view.dataset.view;render();$(`[data-view="${state.view}"]`)?.focus();return}const el=e.target.closest('[data-action]');if(!el)return;switch(el.dataset.action){case'close-menu':$('#drawer').close();break;case'undo':if(undoAction)undoAction();undoAction=null;break;case'record':if(state.recordDraft===null)state.seconds=18;state.paused=false;route('record');break;case'pause-record':{const text=$('#transcript').value;state.paused=!state.paused;render();$('#transcript').value=text;$('[data-action="pause-record"]').focus();break}case'save-record':{const text=$('#transcript').value;if(!text.trim()){toast(t('Add a few words before saving.','أضف كلمات قبل الحفظ.'));$('#transcript').focus();break}clearInterval(recordTimer);saveMemory(text,true);state.recordDraft=null;state.seconds=18;break}case'discard-record':confirmBox(t('Discard this sample?','حذف هذا النموذج؟'),t('The sample text will be cleared. Your real recordings are not involved.','سيُمسح النص النموذجي. تسجيلاتك الحقيقية لا تتأثر.'),t('Discard','حذف'),()=>{route('home');state.recordDraft=null;state.seconds=18;render()});break;case'confirm-insight':{const id=state.route.slice(7);state.confirmed[id]=true;render();toast(t('Marked as your confirmed understanding.','تم التأشير كفهم أكدته أنت.'),()=>{state.confirmed[id]=false;render()});break}case'unconfirm-insight':state.confirmed[state.route.slice(7)]=false;render();break;case'dismiss-insight':{const id=state.route.slice(7);state.dismissed[id]=true;render();toast(t('Suggestion dismissed.','تم تجاهل الاقتراح.'),()=>{state.dismissed[id]=false;render()});break}case'sample-play':$('#sampleTranscript').open=!$('#sampleTranscript').open;toast(t('Sample transcript shown. No audio plays.','عُرض النص النموذجي. لا يُشغل صوت.'));break;case'reminder':state.reminder=!state.reminder;render();$('[data-action="reminder"]').focus();break;case'start-import':startImport();break;case'pause-import':state.importPaused=!state.importPaused;render();$('[data-action="pause-import"]').focus();break;case'cancel-import':confirmBox(t('Cancel this import?','إلغاء هذا الاستيراد؟'),t('Only the sample progress will be cleared.','سيُمسح التقدم النموذجي فقط.'),t('Cancel import','إلغاء الاستيراد'),()=>{clearInterval(importTimer);state.importStarted=false;state.importProgress=0;render();toast(t('Sample import cancelled.','تم إلغاء الاستيراد النموذجي.'))});break;case'end-private':state.private=false;state.messages=[];state.draft='';state.recordDraft=null;if(state.activeVoice?.temporary)state.activeVoice=null;route('home');break;case'private':state.private=!state.private;if(!state.private){state.messages=[];state.draft='';state.recordDraft=null;if(state.activeVoice?.temporary)state.activeVoice=null}render();$('[data-action="private"]').focus();break;case'language':state.lang=state.lang==='en'?'ar':'en';render();$('[data-action="language"]').focus();break;case'reset':confirmBox(t('Reset the demo?','إعادة ضبط العرض؟'),t('This clears the sample changes you made on this page.','يمسح هذا التغييرات النموذجية التي أجريتها في هذه الصفحة.'),t('Reset demo','إعادة ضبط العرض'),()=>location.reload());break;case'cancel-confirm':$('#confirm').close();break;case'accept-confirm':$('#confirm').close();if(confirmAction)confirmAction();break;}});
document.addEventListener('submit',e=>{if(e.target.id==='captureForm'){e.preventDefault();saveMemory($('#captureInput').value)}if(e.target.id==='chatForm'){e.preventDefault();const v=$('#chatInput').value.trim();if(!v){$('#chatInput').focus();return}state.messages.push(v);render();$('#chatInput').focus();$('#chatInput').scrollIntoView({block:'nearest'})}});
document.addEventListener('input',e=>{if(e.target.id==='captureInput')state.draft=e.target.value;if(e.target.id==='transcript')state.recordDraft=e.target.value;if(e.target.id==='searchInput'){state.query=e.target.value;$('#searchResults').innerHTML=searchResults(state.query)}if(e.target.id==='peopleSearch')$('#peopleResults').innerHTML=personRows(e.target.value)});
for(const dialog of [$('#drawer'),$('#confirm')]){dialog.addEventListener('click',e=>{if(e.target===dialog){const b=dialog.getBoundingClientRect();if(e.clientX<b.left||e.clientX>b.right||e.clientY<b.top||e.clientY>b.bottom)dialog.close()}});dialog.addEventListener('close',()=>{if(returnFocus?.isConnected)returnFocus.focus()})}
window.addEventListener('hashchange',()=>{const r=location.hash.slice(1)||'home';if(r!==state.route){if(state.route==='record')clearInterval(recordTimer);state.route=r;render();if(r==='record')startClock()}});
if(location.hash)state.route=location.hash.slice(1);render();if(state.route==='record')startClock();
})();
</script>
</body></html>
